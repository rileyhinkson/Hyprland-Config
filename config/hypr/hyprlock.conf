general {
    hide_cursor = true
    grace = 3
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/sr71.jpg
    blur_passes = 3
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 72
    color = rgba(ffffffee)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 20
    color = rgba(ffffffcc)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(5bcefaee) rgba(f5a9b8ee) rgba(ffffffee) rgba(f5a9b8ee) rgba(5bcefaee) 45deg
    inner_color = rgba(1a1a1acc)
    font_color = rgba(ffffffff)
    placeholder_text = Password
    fade_on_empty = false
    rounding = 10
    position = 0, -40
    halign = center
    valign = center
}
